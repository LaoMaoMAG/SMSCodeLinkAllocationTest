<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>短信接码-管理面板</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/dialog.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="AdminPanel.styles.css" rel="stylesheet" />
    <script src="javascript/cookie_service.js"></script>
    <script src="javascript/download_file.js"></script>
    <script src="javascript/upload_file.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* 现代化加载界面样式 */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: 400% 400%;
            animation: loading-gradientShift 15s ease infinite;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        @keyframes loading-gradientShift {
            0% {
                background-position: 0 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0 50%;
            }
        }

        #loading-particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .loading-spinner {
            width: 120px;
            height: 120px;
            position: relative;
            margin-bottom: 2rem;
            z-index: 10;
        }

        .loading-spinner div {
            position: absolute;
            border-radius: 50%;
            animation: loading-spinner 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            transform-origin: center center;
        }

        .loading-spinner div:nth-child(1) {
            width: 100%;
            height: 100%;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            animation-duration: 1.8s;
        }

        .loading-spinner div:nth-child(2) {
            width: 75%;
            height: 75%;
            top: 12.5%;
            left: 12.5%;
            border: 5px solid transparent;
            border-top-color: #ffeb3b;
            animation-duration: 1.4s;
            animation-direction: reverse;
        }

        .loading-spinner div:nth-child(3) {
            width: 50%;
            height: 50%;
            top: 25%;
            left: 25%;
            border: 4px solid transparent;
            border-top-color: #4caf50;
            animation-duration: 1s;
        }

        .loading-spinner div:nth-child(4) {
            width: 25%;
            height: 25%;
            top: 37.5%;
            left: 37.5%;
            border: 3px solid transparent;
            border-top-color: #f44336;
            animation-duration: 0.6s;
            animation-direction: reverse;
        }

        .loading-text {
            color: white;
            font-family: 'Microsoft YaHei', '微软雅黑', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            margin-top: 1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .loading-subtext {
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Microsoft YaHei', '微软雅黑', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.2rem;
            font-weight: 300;
            margin-top: 0.8rem;
            animation: pulse 1.5s infinite;
            z-index: 10;
        }

        .loading-dots {
            display: inline-block;
            width: 20px;
            text-align: left;
            font-weight: bold;
        }

        @keyframes loading-spinner {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.6;
            }
        }

        /* 错误界面美化 */
        #blazor-error-ui {
            background: #fff;
            bottom: 0;
            box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.2);
            display: none;
            left: 0;
            padding: 0.6rem 1.25rem 0.7rem 1.25rem;
            position: fixed;
            width: 100%;
            z-index: 1000;
            border-top: 1px solid #e5e5e5;
            background: linear-gradient(to right, #ff416c, #ff4b2b);
            color: white;
            text-align: center;
        }

        #blazor-error-ui .dismiss {
            cursor: pointer;
            position: absolute;
            right: 0.75rem;
            top: 0.5rem;
            font-size: 1.2rem;
        }

        #blazor-error-ui .reload {
            color: white;
            text-decoration: underline;
        }

        /* 隐藏默认的加载进度元素 */
        .loading-progress, .loading-progress-text {
            display: none;
        }
    </style>
</head>

<body>
<div id="app">
    <canvas id="loading-particleCanvas"></canvas>
    <div class="loading-container">
        <div class="loading-spinner">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="loading-text">资源加载</div>
        <div class="loading-subtext">正在加载网站资源</div>
    </div>
</div>

<div id="blazor-error-ui">
    发生未处理的错误。
    <a href="" class="reload">重新加载</a>
    <a class="dismiss">🗙</a>
</div>
<script src="_framework/blazor.webassembly.js"></script>
<script>
    // 创建灵动的加载点动画
    document.addEventListener('DOMContentLoaded', function() {
        const dotsElement = document.querySelector('.loading-dots');
        let dots = 0;

        setInterval(function() {
            dots = (dots % 3) + 1;
            dotsElement.textContent = '.'.repeat(dots);
        }, 500);
    });

    // 当应用加载完成后隐藏加载界面
    window.addEventListener('load', function() {
        setTimeout(function() {
            const loadingContainer = document.querySelector('.loading-container');
            if (loadingContainer) {
                loadingContainer.style.opacity = '0';
                setTimeout(function() {
                    loadingContainer.style.display = 'none';
                }, 500);
            }
        }, 500);
    });

    // 添加粒子背景效果
    window.initializeParticleBackground = () => {
        const canvas = document.getElementById('loading-particleCanvas');
        const ctx = canvas.getContext('2d');

        // 设置画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 粒子类
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 1 - 0.5;
                this.speedY = Math.random() * 1 - 0.5;
                this.color = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.1})`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                // 边界检查
                if (this.x > canvas.width || this.x < 0) this.speedX = -this.speedX;
                if (this.y > canvas.height || this.y < 0) this.speedY = -this.speedY;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 创建粒子数组
        const particles = [];
        const particleCount = Math.min(100, Math.floor((window.innerWidth * window.innerHeight) / 5000));

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // 连线距离
        const connectDistance = 100;

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 更新和绘制粒子
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            // 绘制粒子之间的连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectDistance) {
                        const opacity = 1 - distance / connectDistance;
                        ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.2})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        animate();

        // 鼠标交互
        let mouseX = undefined;
        let mouseY = undefined;

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.x;
            mouseY = e.y;
        });

        canvas.addEventListener('mouseleave', () => {
            mouseX = undefined;
            mouseY = undefined;
        });
    };

    // 初始化粒子背景
    window.initializeParticleBackground();
</script>
</body>

</html>
